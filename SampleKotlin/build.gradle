import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile

plugins {
    id 'java'
    alias(libs.plugins.buildConfig)
    alias(libs.plugins.kotlin.jvm)
    alias(libs.plugins.kotlin.kapt)
    id 'com.christophecvb.touchportal.plugin-packager' version "+"
}

def mainClassSimpleName = 'TouchPortalSampleKotlinPlugin'
def mainClassPackage = 'com.christophecvb.touchportal.samplekotlin'
group mainClassPackage
version versionName

tpPlugin.mainClassSimpleName = mainClassSimpleName

// Java Version to Target with Java 8 as default. Can be changed in a task e.g. buildTargetJvmVersion.set(17)
final def buildTargetJvmVersion = objects.property(Integer.class).convention(8) as Property<Integer>

buildConfig {
    packageName = project.group

    useKotlinOutput()

    buildConfigField 'String', 'NAME', "\"${project.name}\""
    buildConfigField 'String', 'VERSION_NAME', "\"${versionName}\""
    buildConfigField 'long', 'VERSION_CODE', versionCode + ''
}

dependencies {
    implementation platform(libs.kotlin.bom)

    implementation libs.kotlin.stdLib

    implementation project(':Library')

    kapt project(':AnnotationsProcessor')
}

// Version of Java for Builds to Target - Set this here or in a task.
if (JavaVersion.current().java9Compatible) {
    tasks.withType(JavaCompile).configureEach {
        options.release = buildTargetJvmVersion
    }

    tasks.withType(KotlinJvmCompile).configureEach { task ->
        Provider<JvmTarget> targetJreVersionKotlin = buildTargetJvmVersion.map { targetVer ->
            targetVer == 8 ? JvmTarget.JVM_1_8 : JvmTarget.fromTarget(targetVer.toString())
        }

        Provider<List<String>> targetJreVersionKotlinRelease = buildTargetJvmVersion.map { targetVer ->
            ["-Xjdk-release=" + JavaVersion.toVersion(targetVer).majorVersion].toList()
        }

        println('Note: Task ' + task.name + ' - set javaParameters to true')
        compilerOptions.javaParameters.set(true)

        println('Task ' + task.name + ': Prepared JVM Target/JDK Release')
        compilerOptions.jvmTarget.set(targetJreVersionKotlin)
        compilerOptions.freeCompilerArgs.addAll(targetJreVersionKotlinRelease)
    }
}