[versions]

## Libs
gson = "2.11.0"
okHttp = "4.12.0"
autoService = "1.1.1"
javaPoet = "1.13.0"

jUnit = "4.13.2"
kotlinGradle = "1.9.25"

## Gradle Plugins
pluginPublish = "0.15.0"
buildConfig = "3.0.0"

## Kotlin Sample
kotlin = "1.9.25"



[libraries]

gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okHttp" }
autoservice = { module = "com.google.auto.service:auto-service", version.ref = "autoService" }
javapoet = { module = "com.squareup:javapoet", version.ref = "javaPoet" }

# https://mvnrepository.com/artifact/org.jetbrains.kotlin/kotlin-gradle-plugins-bom
kotlingradleplugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlinGradle" }

## Testing

# https://mvnrepository.com/artifact/org.junit/junit-bom
junit = { module = "junit:junit", version.ref = "jUnit" }


## Kotlin Sample
# https://mvnrepository.com/artifact/org.jetbrains.kotlin/kotlin-bom
kotlinstdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }



[plugins]

buildConfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildConfig" }
pluginPublish = { id = "com.gradle.plugin-publish", version.ref = "pluginPublish" }

## Kotlin Sample
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }



[bundles]
